[package]
name = "jade"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
tracing = "0.1.44"
thiserror = "2.0.20"
glam = "0.34.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread"] }
winit = "0.30.13"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "metal"] }
gltf = "1.4.1"
tobj = "4.0.3"

[dependencies.naga]
version = "30.0.1"
features = [
    "wgsl-out",
    "spv-out",
    "glsl-out",
    "wgsl-in",
    "deserialize"
]
